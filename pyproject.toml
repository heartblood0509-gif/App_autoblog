[project]
name = "autoblog"
version = "0.1.0"
description = "네이버 블로그 자동 포스팅 데스크톱 앱 (Gemini 2.5 + Nano Banana 2, BYOK)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "윤서준", email = "heartblood0509@gmail.com" },
]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "loguru>=0.7.2",
]

[project.scripts]
autoblog = "autoblog.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length (ruff format이 처리)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["nodriver.*", "pyperclip.*", "pyautogui.*", "piexif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
